name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted Publishing: npm confía en este workflow por OIDC, sin token ni secreto.
    # Configurado en npmjs.com → @playtopia/icons → Settings → Trusted Publisher.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      # Trusted Publishing necesita npm 11.5.1 o superior.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Publish
        run: npm publish --access public
